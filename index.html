<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay</title>
<style>
  :root {
    --bg:#f4f5f7; --card:#fff; --text:#111; --muted:#667085; --line:#d5d9e2;
    --accent:#1f6feb; --accent-text:#fff; --chip:#e7e9ee; --soft:#f1f3f7;
    --ok:#067647; --err:#b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#eef0f4; --muted:#98a2b3; --line:#2c313b;
            --chip:#262b34; --soft:#20242c; --ok:#47cd89; --err:#f97066; }
  }
  *, *::before, *::after { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
  .wrap { max-width:460px; margin:0 auto; padding:20px; }
  h1 { font-size:1.4rem; text-align:center; margin:12px 0 20px; word-break:break-word; }
  .card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .tabs { display:flex; gap:8px; margin-bottom:18px; }
  .tabs button { flex:1; padding:11px 6px; border:0; border-radius:10px; background:var(--chip); color:var(--text);
                 font-size:.95rem; cursor:pointer; }
  .tabs button[aria-selected="true"] { background:var(--accent); color:var(--accent-text); }
  label { display:block; font-size:.9rem; margin:12px 0 6px; color:var(--muted); }
  label:first-child { margin-top:0; }
  input, select { width:100%; padding:12px; font-size:1rem; border:1px solid var(--line); border-radius:10px;
                  background:var(--card); color:var(--text); }
  .btn { width:100%; margin-top:14px; padding:14px; border:0; border-radius:10px; background:var(--accent);
         color:var(--accent-text); font-size:1rem; font-weight:600; cursor:pointer; text-decoration:none;
         display:block; text-align:center; }
  .btn.alt { background:var(--chip); color:var(--text); }
  .addr { word-break:break-all; font-family:ui-monospace,Menlo,Consolas,monospace; background:var(--soft);
          padding:12px; border-radius:10px; margin-top:12px; font-size:.9rem; user-select:all; }
  .note { font-size:.82rem; color:var(--muted); margin-top:12px; text-align:center; line-height:1.4; }
  .msg { min-height:1.2em; font-size:.88rem; margin-top:10px; text-align:center; line-height:1.4; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); }
  .center { text-align:center; color:var(--muted); padding:12px 0; }
  .ref { display:flex; align-items:center; justify-content:center; gap:8px; font-size:.85rem; color:var(--muted); margin-bottom:16px; }
  .ref b { color:var(--text); font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:.5px; }
  .link { background:none; border:0; color:var(--accent); font-size:.85rem; cursor:pointer; padding:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chip { padding:9px 14px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--text);
          font-size:.92rem; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
  details.proof { margin-top:18px; border-top:1px solid var(--line); padding-top:14px; }
  details.proof summary { cursor:pointer; font-weight:600; font-size:.95rem; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="siteTitle">Pay</h1>
  <div class="card">
    <div id="state" class="center">Loading…</div>

    <div id="main" class="hidden">
      <div class="ref">Your reference: <b id="refText"></b> <button id="refCopy" class="link" type="button">Copy</button></div>
      <div id="tabs" class="tabs" role="tablist"></div>

      <section id="panel-upi" class="hidden" role="tabpanel">
        <label for="amount">Amount (₹)</label>
        <div id="quick" class="chips hidden"></div>
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="Enter amount">
        <button id="upiBtn" class="btn" type="button">Pay with UPI</button>
        <div id="upiMsg" class="msg" aria-live="polite"></div>
        <div id="upiNote" class="note">Opens your UPI app with the amount filled in.</div>
      </section>

      <section id="panel-crypto" class="hidden" role="tabpanel">
        <label for="coin">Select coin</label>
        <select id="coin"></select>
        <div id="addressBox" class="addr"></div>
        <button id="copyBtn" class="btn alt" type="button">Copy address</button>
        <div id="cryptoMsg" class="msg" aria-live="polite"></div>
        <div class="note">Send only the selected coin on its own network. Other coins sent to this address can be lost.</div>
      </section>

      <section id="panel-card" class="hidden" role="tabpanel">
        <a id="cardBtn" class="btn" href="#" target="_blank" rel="noopener noreferrer">Pay with card</a>
        <div class="note">You'll be taken to a secure card payment page.</div>
      </section>

      <details id="proof" class="proof hidden">
        <summary>I've paid — send proof</summary>
        <label for="pMethod">Payment method</label>
        <select id="pMethod"></select>
        <label for="pAmount">Amount paid</label>
        <input id="pAmount" type="text" maxlength="30" autocomplete="off" placeholder="₹500 or 20 USDT">
        <label for="pTxn">Transaction ID (UTR or hash)</label>
        <input id="pTxn" type="text" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false">
        <label for="pName">Your name (optional)</label>
        <input id="pName" type="text" maxlength="60" autocomplete="name">
        <div id="pMsg" class="msg" aria-live="polite"></div>
        <button id="pWa" class="btn hidden" type="button">Send on WhatsApp</button>
        <button id="pTg" class="btn alt hidden" type="button">Send on Telegram</button>
        <button id="pMail" class="btn alt hidden" type="button">Send by email</button>
        <button id="pCopy" class="btn alt" type="button">Copy message</button>
      </details>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var cfg = {};
  var cryptoList = [];
  var contacts = { wa: '', tg: '', em: '' };
  var ref = '';
  var awaiting = false, away = false, pAmountTouched = false;
  var METHOD_LABELS = { upi: 'UPI (INR)', crypto: 'Crypto', card: 'Card' };

  function validUpi(v) { return /^[a-zA-Z0-9._-]{2,256}@[a-zA-Z0-9.-]{2,64}$/.test(v || ''); }
  function validHttps(v) { try { return new URL(v).protocol === 'https:'; } catch (e) { return false; } }
  function validEmail(v) { return v.length <= 100 && /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(v); }
  function cleanText(s, max) { return String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max); }

  function parseAmount(raw) {
    var s = String(raw || '').trim().replace(/,/g, '');
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
    var n = parseFloat(s);
    if (!(n >= 1) || n > 100000) return null;
    return n;
  }

  function cleanAmounts(list) {
    if (!Array.isArray(list)) return [];
    var out = [];
    list.forEach(function (v) {
      var n = Number(v);
      if (!isFinite(n) || n < 1 || n > 100000) return;
      if (Math.abs(n * 100 - Math.round(n * 100)) > 1e-6) return;
      if (out.indexOf(n) === -1 && out.length < 6) out.push(n);
    });
    return out;
  }

  function cleanContacts(c) {
    var wa = String(c.whatsapp || '').replace(/[\s+\-()]/g, '');
    if (!/^\d{8,15}$/.test(wa)) wa = '';
    var tg = String(c.telegram || '').trim().replace(/^@/, '');
    if (!/^[A-Za-z0-9_]{5,32}$/.test(tg)) tg = '';
    var em = String(c.contactEmail || '').trim();
    if (!validEmail(em)) em = '';
    return { wa: wa, tg: tg, em: em };
  }

  function getRef() {
    try {
      var s = sessionStorage.getItem('pay.ref');
      if (/^PAY-[A-Z2-9]{6}$/.test(s || '')) return s;
    } catch (e) {}
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = '', arr = new Uint8Array(6), i;
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(arr);
    else for (i = 0; i < 6; i++) arr[i] = Math.floor(Math.random() * 256);
    for (i = 0; i < 6; i++) out += chars.charAt(arr[i] % chars.length);
    var r = 'PAY-' + out;
    try { sessionStorage.setItem('pay.ref', r); } catch (e) {}
    return r;
  }

  function buildUpiUrl(c, amount, reference) {
    var parts = ['pa=' + encodeURIComponent(c.upiId).replace(/%40/g, '@')];
    if (c.payeeName) parts.push('pn=' + encodeURIComponent(c.payeeName));
    parts.push('am=' + amount.toFixed(2), 'cu=INR');
    var site = cleanText(c.siteName || 'Payment', 50);
    var note = reference ? (site.slice(0, Math.max(0, 49 - reference.length)).trim() + ' ' + reference).trim() : site;
    parts.push('tn=' + encodeURIComponent(note));
    return 'upi://pay?' + parts.join('&');
  }

  function buildProofMessage(p) {
    var lines = ['Payment proof - ' + p.siteName, 'Reference: ' + p.ref, 'Method: ' + p.method];
    if (p.coin) lines.push('Coin: ' + p.coin);
    lines.push('Amount: ' + p.amount, 'Transaction ID: ' + p.txn);
    if (p.name) lines.push('Name: ' + p.name);
    return lines.join('\n');
  }
  function waUrl(num, msg) { return 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg); }
  function mailUrl(email, subject, body) {
    return 'mailto:' + email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }

  window.buildUpiUrl = buildUpiUrl;
  window.buildProofMessage = buildProofMessage;
  window.waUrl = waUrl;
  window.mailUrl = mailUrl;

  function setMsg(id, text, kind) {
    var el = $(id);
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) resolve(); else reject(new Error('copy failed'));
      } catch (e) { reject(e); }
    });
  }

  function go(url, newTab) {
    if (newTab) window.open(url, '_blank', 'noopener');
    else window.location.href = url;
  }

  function showTab(id) {
    ['upi', 'crypto', 'card'].forEach(function (t) {
      var p = $('panel-' + t);
      if (p) p.classList.toggle('hidden', t !== id);
      var b = $('tab-' + t);
      if (b) b.setAttribute('aria-selected', t === id ? 'true' : 'false');
    });
    var opt = $('pMethod').querySelector('option[value="' + id + '"]');
    if (opt) $('pMethod').value = id;
  }

  function showCoin() {
    var item = cryptoList[$('coin').selectedIndex];
    $('addressBox').textContent = item ? item.address : '';
    setMsg('cryptoMsg', '');
  }

  function markChip(active) {
    Array.prototype.forEach.call($('quick').children, function (c) {
      c.setAttribute('aria-pressed', c === active ? 'true' : 'false');
    });
  }

  function prefillProofAmount() {
    if (pAmountTouched || $('pAmount').value) return;
    var n = parseAmount($('amount').value);
    if (n !== null && $('pMethod').value === 'upi') $('pAmount').value = '₹' + n.toFixed(2);
  }

  function openProof() {
    if ($('proof').classList.contains('hidden')) return;
    prefillProofAmount();
    $('proof').open = true;
    setMsg('pMsg', 'Paid? Enter your transaction ID and send the proof.', '');
    try { $('proof').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
  }

  function render() {
    document.title = cfg.siteName || 'Pay';
    $('siteTitle').textContent = cfg.siteName || 'Pay';

    cryptoList = (Array.isArray(cfg.cryptoOptions) ? cfg.cryptoOptions : []).filter(function (c) {
      return c && String(c.coin || '').trim() && String(c.address || '').trim();
    });
    contacts = cleanContacts(cfg);

    var methods = [];
    if (validUpi(cfg.upiId)) methods.push('upi');
    if (cryptoList.length) methods.push('crypto');
    if (validHttps(cfg.cardPaymentLink)) methods.push('card');

    if (!methods.length) {
      $('main').classList.add('hidden');
      $('state').classList.remove('hidden');
      $('state').textContent = 'Payments are not available right now.';
      return;
    }

    ref = getRef();
    $('refText').textContent = ref;

    var tabs = $('tabs');
    tabs.textContent = '';
    var pm = $('pMethod');
    pm.textContent = '';
    methods.forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button'; b.id = 'tab-' + m; b.setAttribute('role', 'tab');
      b.textContent = METHOD_LABELS[m];
      b.addEventListener('click', function () { showTab(m); });
      tabs.appendChild(b);
      var o = document.createElement('option');
      o.value = m; o.textContent = METHOD_LABELS[m];
      pm.appendChild(o);
    });

    var sel = $('coin');
    sel.textContent = '';
    cryptoList.forEach(function (c, i) {
      var o = document.createElement('option');
      o.value = String(i); o.textContent = c.coin;
      sel.appendChild(o);
    });
    showCoin();

    if (validHttps(cfg.cardPaymentLink)) $('cardBtn').href = cfg.cardPaymentLink;

    var quick = $('quick');
    quick.textContent = '';
    var amounts = cleanAmounts(cfg.quickAmounts);
    amounts.forEach(function (a) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', 'false');
      b.textContent = '₹' + a.toLocaleString('en-IN');
      b.addEventListener('click', function () {
        $('amount').value = String(a);
        markChip(b);
        setMsg('upiMsg', '');
      });
      quick.appendChild(b);
    });
    quick.classList.toggle('hidden', !amounts.length);

    var hasContact = !!(contacts.wa || contacts.tg || contacts.em);
    $('proof').classList.toggle('hidden', !hasContact);
    $('pWa').classList.toggle('hidden', !contacts.wa);
    $('pTg').classList.toggle('hidden', !contacts.tg);
    $('pMail').classList.toggle('hidden', !contacts.em);

    if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      $('upiNote').textContent = 'UPI payments work on a phone with a UPI app installed.';
    }

    $('state').classList.add('hidden');
    $('main').classList.remove('hidden');
    showTab(methods[0]);
  }

  function payUpi() {
    setMsg('upiMsg', '');
    var amount = parseAmount($('amount').value);
    if (amount === null) {
      setMsg('upiMsg', 'Enter an amount between ₹1 and ₹1,00,000.', 'err');
      return;
    }
    if (!validUpi(cfg.upiId)) {
      setMsg('upiMsg', 'UPI payment is not set up yet.', 'err');
      return;
    }
    setMsg('upiMsg', 'Opening your UPI app…', 'ok');
    awaiting = true; away = false;
    setTimeout(function () {
      if (!away) setMsg('upiMsg', 'If your UPI app did not open, try again on a phone with a UPI app installed.', 'err');
    }, 2500);
    window.location.href = buildUpiUrl(cfg, amount, ref);
  }

  function collectProof() {
    var method = $('pMethod').value;
    var amount = cleanText($('pAmount').value, 30);
    var txn = $('pTxn').value.trim();
    var name = cleanText($('pName').value, 60);
    if (!amount) { setMsg('pMsg', 'Enter the amount you paid.', 'err'); return null; }
    if (!/^[A-Za-z0-9_.:\-]{6,100}$/.test(txn)) {
      setMsg('pMsg', 'Enter a valid transaction ID (6 to 100 letters or numbers).', 'err');
      return null;
    }
    var item = method === 'crypto' ? cryptoList[$('coin').selectedIndex] : null;
    setMsg('pMsg', '');
    return {
      siteName: cleanText(cfg.siteName || 'Payment', 60), ref: ref, method: METHOD_LABELS[method] || method,
      coin: item ? item.coin : '', amount: amount, txn: txn, name: name
    };
  }

  function load() {
    $('state').classList.remove('hidden');
    $('state').textContent = 'Loading…';
    $('main').classList.add('hidden');
    fetch('config.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data || typeof data !== 'object') throw new Error('bad config');
        cfg = data;
        render();
      })
      .catch(function () {
        $('state').textContent = '';
        var p = document.createElement('div');
        p.textContent = 'Could not load payment settings.';
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'btn alt'; b.textContent = 'Try again';
        b.addEventListener('click', load);
        $('state').appendChild(p);
        $('state').appendChild(b);
      });
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      away = true;
      setMsg('upiMsg', '');
    } else if (away && awaiting) {
      away = false; awaiting = false;
      openProof();
    }
  });

  $('upiBtn').addEventListener('click', payUpi);
  $('amount').addEventListener('keydown', function (e) { if (e.key === 'Enter') payUpi(); });
  $('amount').addEventListener('input', function () { setMsg('upiMsg', ''); markChip(null); });
  $('coin').addEventListener('change', showCoin);
  $('copyBtn').addEventListener('click', function () {
    var text = $('addressBox').textContent;
    if (!text) return;
    copyText(text).then(
      function () { setMsg('cryptoMsg', 'Address copied.', 'ok'); },
      function () { setMsg('cryptoMsg', 'Could not copy. Press and hold the address to copy it.', 'err'); }
    );
  });
  $('refCopy').addEventListener('click', function () {
    copyText(ref).then(function () { $('refCopy').textContent = 'Copied'; setTimeout(function () { $('refCopy').textContent = 'Copy'; }, 1500); }, function () {});
  });

  $('proof').addEventListener('toggle', function () { if ($('proof').open) prefillProofAmount(); });
  $('pAmount').addEventListener('input', function () { pAmountTouched = true; setMsg('pMsg', ''); });
  $('pTxn').addEventListener('input', function () { setMsg('pMsg', ''); });

  $('pWa').addEventListener('click', function () {
    var p = collectProof(); if (!p) return;
    go(waUrl(contacts.wa, buildProofMessage(p)), true);
  });
  $('pTg').addEventListener('click', function () {
    var p = collectProof(); if (!p) return;
    var pr = copyText(buildProofMessage(p));
    go('https://t.me/' + contacts.tg, true);
    pr.then(
      function () { setMsg('pMsg', 'Message copied. Paste it in the Telegram chat.', 'ok'); },
      function () { setMsg('pMsg', 'Could not copy the message. Use "Copy message" and paste it in Telegram.', 'err'); }
    );
  });
  $('pMail').addEventListener('click', function () {
    var p = collectProof(); if (!p) return;
    go(mailUrl(contacts.em, 'Payment proof ' + p.ref, buildProofMessage(p)), false);
  });
  $('pCopy').addEventListener('click', function () {
    var p = collectProof(); if (!p) return;
    copyText(buildProofMessage(p)).then(
      function () { setMsg('pMsg', 'Message copied.', 'ok'); },
      function () { setMsg('pMsg', 'Could not copy the message.', 'err'); }
    );
  });

  load();
})();
</script>
</body>
</html>
